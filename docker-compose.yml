# Sobe o gamificacao-api com o Postgres dele.
#
#   cp .env.example .env     → preencha NEXO_JWT_SECRET e DB_PASSWORD
#   docker compose up --build              → API em http://localhost:8084
#   docker compose up -d postgres-gamificacao → só o banco (e a API via ./mvnw spring-boot:run)
#   docker compose down -v                 → para e apaga o banco
#
# É um banco SEPARADO dos outros serviços (outro container, outro volume, outra porta).
name: nexo-gamificacao

services:
  postgres-gamificacao:
    image: postgres:16-alpine
    container_name: nexo-postgres-gamificacao
    environment:
      POSTGRES_USER: nexo_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: gamificacao_db
    ports:
      # 5439 no host (5436 usuario-api, 5437 pedagogico-api, 5438 comunicacao-api). Só importa para quem roda a API fora
      # do Docker; a API em container usa a rede interna.
      - "127.0.0.1:${DB_HOST_PORT:-5439}:5432"
    volumes:
      - postgres_gamificacao_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo_admin -d gamificacao_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  gamificacao-api:
    build: .
    image: nexo-gamificacao-api:local
    container_name: nexo-gamificacao-api
    depends_on:
      postgres-gamificacao:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8084}:8084"
    environment:
      # Dentro da rede do compose o banco é o serviço, não localhost.
      DB_URL: jdbc:postgresql://postgres-gamificacao:5432/gamificacao_db
      DB_USER: nexo_admin
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      # O MESMO segredo do usuario-api, que emite o token — é o que faz o token valer aqui.
      NEXO_JWT_SECRET: ${NEXO_JWT_SECRET:?defina NEXO_JWT_SECRET no .env (openssl rand -base64 48)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      NEXO_SEED_ENABLED: ${NEXO_SEED_ENABLED:-false}
      # Etapa e turma do aluno vêm do pedagogico-api (no host, via host.docker.internal).
      NEXO_PEDAGOGICO_URL: ${NEXO_PEDAGOGICO_URL:-http://host.docker.internal:8082}
      NEXO_PEDAGOGICO_ENABLED: ${NEXO_PEDAGOGICO_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Endurecimento do runtime: filesystem só de leitura (o único lugar que escreve é o
    # /tmp do Tomcat, em tmpfs).
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres_gamificacao_data:
